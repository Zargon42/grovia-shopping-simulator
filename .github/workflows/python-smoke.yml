name: Python smoke check

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python store_sim.py --help
      - run: python store_sim.py --store lidl_store_layout.json --n-lists 2 --out smoke-results
      - run: python -c "import pandas as pd; s=pd.read_csv('smoke-results/Lidl_store/summary.csv'); assert set(s.strategy)=={'S0','S1','S2','S3','S4','S5','S6'}"
